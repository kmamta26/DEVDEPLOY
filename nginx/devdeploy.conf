# Main NGINX configuration for DevDeploy
# This should be placed at /etc/nginx/sites-enabled/devdeploy
# Individual project configs are included dynamically.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Serve the DevDeploy frontend dashboard
    root /var/www/devdeploy-frontend;
    index index.html;

    # Proxy the backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;
    }

    # Include all dynamically generated project location blocks
    include /etc/nginx/devdeploy-sites/*.conf;

    # Default fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
