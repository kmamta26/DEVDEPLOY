<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDeploy — Initialise Stack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="devdeploy-v3.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030014] text-white p-10 font-['Inter'] relative min-h-screen overflow-x-hidden">
    <!-- Premium Mesh Orbs -->
    <div class="fixed top-[-10%] right-[-5%] w-[600px] h-[600px] bg-purple-500/20 rounded-full blur-[120px] -z-10 animate-pulse"></div>
    <div class="fixed bottom-[-15%] left-[-10%] w-[700px] h-[700px] bg-pink-500/10 rounded-full blur-[150px] -z-10"></div>
    <div class="fixed top-[40%] left-[30%] w-[400px] h-[400px] bg-blue-500/10 rounded-full blur-[100px] -z-10"></div>

    <script src="navbar-v3.js"></script>

    <main class="max-w-4xl mx-auto px-6 py-20 animate-fade">
        <header class="mb-20 text-center">
            <h1 class="text-6xl font-black mb-8 tracking-tightest leading-tight">Force <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500">Node Sync</span></h1>
            <p class="text-lg opacity-40">Initialise your project workspace into our distributed cloud cluster.</p>
        </header>

        <section class="glass-card p-16 rounded-[4rem] border-white/5 animate-fade shadow-3xl">
            <form id="uploadForm" class="space-y-12 max-w-lg mx-auto">
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase tracking-widest text-white/30 ml-4">Deployment Identity</label>
                    <input type="text" id="projectName" placeholder="e.g. coffee-stack-node" required
                           style="width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:2rem;padding:25px 30px;color:white;font-weight:600;outline:none;transition:all">
                </div>

                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase tracking-widest text-white/30 ml-4">Project Workspace (ZIP)</label>
                    <div id="dropZone" onclick="document.getElementById('fileInput').click()" 
                         class="py-20 rounded-[3rem] border-2 border-dashed border-white/5 bg-white/5 text-center flex flex-col items-center gap-6 hover:border-purple-500/40 cursor-pointer transition-all">
                        <div class="w-20 h-20 bg-white/5 rounded-[2rem] flex items-center justify-center text-4xl shadow-xl border border-white/5">📎</div>
                        <p class="text-sm font-black uppercase tracking-widest text-white/40">Drop node archive or click to select</p>
                        <input type="file" id="fileInput" class="hidden" accept=".zip">
                        <p id="fileName" class="text-purple-400 font-bold uppercase truncate max-w-xs text-[10px] tracking-widest"></p>
                    </div>
                </div>

                <div id="statusBox" class="hidden">
                    <div class="py-5 rounded-2xl bg-white/5 border border-white/10 text-center animate-pulse">
                        <span class="text-[9px] font-black uppercase tracking-[0.3em] text-purple-400">INITIALISING CLUSTER SYNC...</span>
                    </div>
                </div>

                <button type="submit" id="deployBtn" class="btn-primary w-full py-8 text-2xl tracking-tightest font-black uppercase">
                    INITIATE DEPLOYMENT &rarr;
                </button>
            </form>
        </section>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisp = document.getElementById('fileName');

        fileInput.onchange = (e) => {
            if (e.target.files.length) {
                fileNameDisp.innerText = `READY: ${e.target.files[0].name.toUpperCase()}`;
            }
        };

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const projectName = document.getElementById('projectName').value.trim();
            const zipFile = fileInput.files[0];
            const status = document.getElementById('statusBox');
            const btn = document.getElementById('deployBtn');

            if (!zipFile) {
                alert('REJECTED: Attach node ZIP archive first.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'SYNCING NODE...';
            status.classList.remove('hidden');

            const formData = new FormData();
            formData.append('projectName', projectName);
            formData.append('file', zipFile); // FIX: Match Multer "file" field

            try {
                const res = await fetch('/api/deploy/upload', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: formData
                });
                
                const data = await res.json();
                if (res.ok) {
                    window.showToast('CLUSTER SYNCHRONIZED');
                    btn.innerHTML = 'SUCCESS: HANDSHAKE OK';
                    setTimeout(() => window.location.href = '/projects', 1500);
                } else {
                    alert('HANDSHAKE REJECTED: ' + (data.message || 'Cluster rejected payload.'));
                    btn.disabled = false;
                    btn.innerHTML = 'INITIATE DEPLOYMENT';
                    status.classList.add('hidden');
                }
            } catch (err) {
                alert('NODE UNREACHABLE: NETWORK FAULT');
                btn.disabled = false;
                btn.innerHTML = 'INITIATE DEPLOYMENT';
            }
        };
    </script>
</body>
</html>
