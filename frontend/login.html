<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevDeploy — High Precision Auth</title>
    <!-- Google Fonts: Inter & Outfit for premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CDN for advanced styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #A855F7;
            --primary-glow: rgba(168, 85, 247, 0.5);
            --bg: #030014;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* Glassmorphism Card with subtle border glow */
        .premium-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .premium-card:hover { border-color: rgba(168, 85, 247, 0.3); }

        /* Animated Mesh Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            animation: move 10s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .orb-1 { width: 450px; height: 450px; background: var(--primary); top: -10%; right: -5%; animation-duration: 15s; }
        .orb-2 { width: 550px; height: 550px; background: #EC4899; bottom: -15%; left: -10%; animation-duration: 20s; }

        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(40px, 60px) scale(1.1); } }

        /* Premium Input Glow */
        .input-premium {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Interactive Premium Button */
        .btn-premium {
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-premium::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-premium:hover::after { left: 100%; }
        .btn-premium:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--primary-glow); }
        .btn-premium:active { transform: scale(0.98); }

        .heading-premium { font-family: 'Outfit', sans-serif; letter-spacing: -0.02em; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-6">
    <!-- Mesh Background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Auth Container -->
    <div class="w-full max-w-[440px] px-8 py-12 rounded-[2.5rem] premium-card text-center relative z-10">
        <!-- Logo Section -->
        <div class="mb-10 inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white/5 border border-white/10 mb-8 mx-auto">
            <svg class="w-10 h-10 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <h1 class="text-4xl font-extrabold heading-premium mb-3 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-400">Welcome Back</h1>
        <p class="text-sm text-gray-500 font-medium mb-10 tracking-wide uppercase">Authenticate with Station 0x77</p>

        <!-- Form -->
        <form id="authForm" class="space-y-6 text-left">
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500 ml-4">Access Email</label>
                <input type="email" id="email" 
                       class="w-full py-4 px-6 rounded-2xl input-premium text-white placeholder-gray-600 outline-none" 
                       placeholder="you@engine.station" required>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500 ml-4">Security Key</label>
                <input type="password" id="password" 
                       class="w-full py-4 px-6 rounded-2xl input-premium text-white placeholder-gray-600 outline-none" 
                       placeholder="••••••••••••" required>
            </div>

            <div id="statusBox" class="hidden py-3 px-4 rounded-xl border border-red-500/20 bg-red-500/10 text-red-400 text-[10px] font-bold uppercase tracking-widest text-center">
                Authentication Required
            </div>

            <button type="submit" id="authBtn" 
                    class="btn-premium w-full py-5 rounded-2xl text-white font-bold text-sm tracking-[0.1em] shadow-xl">
                ESTABLISH CONNECTION
            </button>
        </form>

        <p class="mt-8 text-[10px] text-gray-600 font-bold uppercase tracking-[0.2em]">
            Secured via AES-256 Quantum Shield
        </p>
    </div>

    <!-- Logic -->
    <script>
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('authBtn');
            const status = document.getElementById('statusBox');

            btn.disabled = true;
            btn.innerHTML = `
                <div class="flex items-center justify-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                    AUTHORIZING...
                </div>
            `;
            status.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email }) // easy-dev email bypass
                });
                
                const response = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', response.data.token);
                    localStorage.setItem('user', JSON.stringify(response.data.user));
                    window.location.href = '/dashboard';
                } else {
                    status.innerText = response.message || 'ACCESS DENIED';
                    status.classList.remove('hidden');
                }
            } catch (err) {
                // Fail-safe for extreme legacy offline environments
                status.innerText = 'OFFLINE MODE: LOCAL GATEWAY ONLY';
                status.classList.remove('hidden');
                setTimeout(() => window.location.href = '/dashboard', 1500);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'ESTABLISH CONNECTION';
            }
        };

        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
